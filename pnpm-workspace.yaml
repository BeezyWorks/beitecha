packages:
  - '.'
  - 'worker'
  # The rules engine, and the design system (a git submodule, BeezyWorks/design-system).
  - 'packages/*'

# Keep pnpm-lock.yaml as a single YAML document (see SiddurOneRN).
pmOnFail: ignore

publicHoistPattern:
  - babel-preset-expo
  - react-refresh

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - '@expo/ui@57.0.20'
  - babel-preset-expo@57.0.13
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo-router@57.0.23
  - expo@57.0.25
